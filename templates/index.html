<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>퇴사자 처리 자동화</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="shell">
    <aside class="nav">
      <div class="nav-brand">🗂 KTY<span>퇴사자 처리 자동화</span></div>
      <nav class="nav-items">
        <button id="manualAddBtn" class="nav-btn">＋ 퇴사자 수동추가</button>
        <button id="mailBtn" class="nav-btn">📧 메일에서 가져오기</button>
        <button id="mailListBtn" class="nav-btn">📋 읽은 메일 보기</button>
        <button id="historyBtn" class="nav-btn">🕘 최근 처리내용</button>
      </nav>
      <div class="nav-spacer"></div>
      <div class="nav-theme">
        <span class="nav-theme-lab">테마</span>
        <div class="theme-opts">
          <button class="theme-opt on" data-theme="default">기본</button>
          <button class="theme-opt" data-theme="aurora">Glass</button>
          <button class="theme-opt" data-theme="brutal">Brutal</button>
          <button class="theme-opt" data-theme="terminal">Terminal</button>
        </div>
      </div>
      <label class="nav-test">
        <input id="testMode" type="checkbox" />
        <span>🧪 테스트 모드<small>실제 처리 안 함 (확인 후 닫힘)</small></span>
      </label>
    </aside>

    <main class="content">
      <header class="content-top">
        <h1>퇴사 처리</h1>
      </header>

      <section class="metrics" id="metrics"></section>

      <div class="layout">
        <aside class="left">
          <h2 class="section-title" style="margin-top:0;">대상 시스템</h2>
          <p class="section-sub muted" id="activeTitle"></p>
          <section id="checklist"></section>
        </aside>

        <div class="right">
          <div class="list-head">
            <h2 class="section-title">대상자 목록</h2>
            <div class="head-actions">
              <button id="runAllBtn">▶ 전체 순차 처리</button>
            </div>
          </div>
          <section id="history"></section>
          <section id="targetList"></section>
        </div>
      </div>
    </main>
  </div>

  <div id="manualModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <div class="modal-head">
        <b>퇴사자 수동추가</b>
        <button id="manualClose" class="ghost">닫기</button>
      </div>
      <div id="manualBody" style="padding:16px;">
        <div class="row">
          <label>이름
            <input id="name" type="text" placeholder="홍길동" />
          </label>
          <label>퇴사일
            <input id="resign_date" type="date" />
          </label>
          <button id="addBtn">추가</button>
        </div>

        <div class="row" style="margin-top:16px;">
          <label>엑셀 업로드 (이름, 퇴사일 열)
            <input id="excel" type="file" accept=".xlsx,.xls" />
          </label>
          <button id="uploadBtn" class="ghost">불러오기</button>
        </div>
      </div>
    </div>
  </div>

  <div id="modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <div class="modal-head">
        <b id="modalTitle"></b>
        <button id="modalClose" class="ghost">닫기</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
