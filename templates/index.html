<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>퇴사자 처리 자동화</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <main>
    <h1>퇴사자 처리 자동화</h1>

    <div class="layout">
      <aside class="left">
        <h2 class="section-title" style="margin-top:0;">대상 시스템</h2>
        <p class="section-sub muted" id="activeTitle"></p>
        <section id="checklist"></section>
      </aside>

      <div class="right">
        <section class="card">
          <div class="row">
            <button id="manualAddBtn">＋ 퇴사자 수동추가</button>
            <button id="mailBtn" class="ghost">📧 메일에서 퇴사자 가져오기</button>
            <button id="mailListBtn" class="ghost">📋 읽은 메일 보기</button>
          </div>
          <p class="muted" style="margin:8px 2px 0;">
            직접 입력·엑셀 업로드는 [퇴사자 수동추가], M365 메일의 퇴사 공지에서
            이름·퇴사일을 읽어오려면 [메일에서 퇴사자 가져오기]를 누르세요.
          </p>

          <label class="testmode">
            <input id="testMode" type="checkbox" />
            🧪 테스트 모드 — 실제 퇴사 처리 안 함 (팝업까지 확인 후 자동으로 닫음)
          </label>
        </section>

        <div class="list-head">
          <h2 class="section-title">대상자 목록</h2>
          <div class="head-actions">
            <button id="runAllBtn">▶ 전체 순차 처리</button>
            <button id="historyBtn" class="ghost">최근 처리내용</button>
          </div>
        </div>
        <section id="history"></section>
        <section id="targetList"></section>
      </div>
    </div>
  </main>

  <div id="manualModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <div class="modal-head">
        <b>퇴사자 수동추가</b>
        <button id="manualClose" class="ghost">닫기</button>
      </div>
      <div id="manualBody" style="padding:16px;">
        <div class="row">
          <label>이름
            <input id="name" type="text" placeholder="홍길동" />
          </label>
          <label>퇴사일
            <input id="resign_date" type="date" />
          </label>
          <button id="addBtn">추가</button>
        </div>

        <div class="row" style="margin-top:16px;">
          <label>엑셀 업로드 (이름, 퇴사일 열)
            <input id="excel" type="file" accept=".xlsx,.xls" />
          </label>
          <button id="uploadBtn" class="ghost">불러오기</button>
        </div>
      </div>
    </div>
  </div>

  <div id="modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <div class="modal-head">
        <b id="modalTitle"></b>
        <button id="modalClose" class="ghost">닫기</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
